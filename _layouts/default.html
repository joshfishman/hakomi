<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body{% if page.url == "/" %} class="home"{% endif %}>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      {% if page.url == "/" %}
        {{ content }}
      {% else %}
        <div class="wrapper">
          {{ content }}
        </div>
      {% endif %}
    </main>

    {%- include footer.html -%}

  </body>

</html>
